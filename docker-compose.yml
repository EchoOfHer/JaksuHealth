version: '3.8'

services:
  # บริการฐานข้อมูล (Local PostgreSQL) - เพิ่มใหม่!
  jaksu-db-local:
    image: postgres:15-alpine
    container_name: jaksuhealth-db-local
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-local_dev_password} # ถ้าไม่มีไฟล์ .env ให้ใช้รหัสนี้แทน
      POSTGRES_DB: jaksuhealth_db
    ports:
      - "5432:5432"
    volumes:
      - jaksu_pg_data:/var/lib/postgresql/data
    networks:
      - jaksu-network

  # บริการระบบหลังบ้าน
  backend:
    build: ./backend
    container_name: jaksuhealth-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app          # ยิงสดโค้ดเข้า Container ทันที
    environment:
      # เปลี่ยนให้ชี้มาที่ Local Database ตัวบนแทน AWS RDS
      - DB_HOST=jaksu-db-local
      - DB_PORT=5432
      - DB_NAME=jaksuhealth_db
      - DB_USER=postgres
      - DB_PASSWORD=${DB_PASSWORD:-local_dev_password}
    restart: always
    depends_on:
      - jaksu-db-local          # รอให้ DB รันเสร็จก่อนค่อยรัน Backend
    networks:
      - jaksu-network

  # บริการระบบหน้าบ้าน
  frontend:
    build: ./frontend
    container_name: jaksuhealth-frontend
    ports:
      - "3000:80"                  # เปิดให้เข้าเว็บตรงๆ
    restart: always
    networks:
      - jaksu-network

# สร้างสะพานเครือข่ายจำลองเชื่อมระบบภายใน
networks:
  jaksu-network:
    driver: bridge

# จองพื้นที่ในฮาร์ดดิสก์เครื่องตัวเองเพื่อเก็บข้อมูล DB ไม่ให้หายตอนปิด Container
volumes:
  jaksu_pg_data: