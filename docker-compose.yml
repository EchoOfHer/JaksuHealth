services:
  # 1. บริการฐานข้อมูล (Local PostgreSQL)
  jaksu-db-local:
    image: postgres:15-alpine
    container_name: jaksuhealth-db-local
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-local_dev_password}
      POSTGRES_DB: jaksuhealth_db
    ports:
      - "5433:5432"
    volumes:
      - jaksu_pg_data:/var/lib/postgresql/data
      # 🌟 แมปโฟลเดอร์ db-init จาก root เข้าไปในคอนเทนเนอร์
      - ./db-init:/docker-entrypoint-initdb.d
    networks:
      - jaksu-network

  # 2. บริการระบบหลังบ้าน (Backend)
  backend:
    build: ./backend             # 🌟 ชี้ไปที่โฟลเดอร์ backend
    container_name: jaksuhealth-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app           # 🌟 แมปโค้ดจากโฟลเดอร์ backend เข้าไปในคอนเทนเนอร์
    environment:
      - DB_HOST=jaksu-db-local
      - DB_PORT=5432
      - DB_NAME=jaksuhealth_db
      - DB_USER=postgres
      - DB_PASSWORD=${DB_PASSWORD:-local_dev_password}
    restart: always
    depends_on:
      - jaksu-db-local
    networks:
      - jaksu-network

  # 3. บริการระบบหน้าบ้าน (Frontend)
  frontend:
    build: ./frontend            # 🌟 ชี้ไปที่โฟลเดอร์ frontend
    container_name: jaksuhealth-frontend
    ports:
      - "127.0.0.1:3000:80"                  # รันระบบหน้าบ้านภายในเครื่องที่พอร์ต 3000 เพื่อรอให้ Host Nginx มาทำ SSL / Proxy ต่อ
    restart: always
    networks:
      - jaksu-network

# สร้างสะพานเครือข่ายจำลองเชื่อมระบบภายใน
networks:
  jaksu-network:
    driver: bridge

# จองพื้นที่ในฮาร์ดดิสก์เครื่องตัวเองเพื่อเก็บข้อมูล DB ไม่ให้หายตอนปิด Container
volumes:
  jaksu_pg_data: